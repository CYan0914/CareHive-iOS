# XcodeGen spec. `xcodegen generate` writes CareHive.xcodeproj from this file.
#
# The project file is generated rather than committed, so the source of truth
# for every build setting is this file and reviewable in a diff. The house
# precedent is the same (TaoMind).
name: CareHive
options:
  bundleIdPrefix: com.cyan0914
  deploymentTarget:
    iOS: "17.0"
  minimumXcodeGenVersion: 2.40
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: H4VQ9X6KYK
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

    # No INFOPLIST_KEY_* settings, and their absence is load-bearing. Those keys
    # only merge into a *generated* Info.plist; the target below sets
    # GENERATE_INFOPLIST_FILE to NO and points at an explicit file, so anything
    # declared that way is dropped from the built app without a warning. Every
    # Info.plist entry -- the App Store display name, portrait-only, the
    # encryption flag -- lives in Resources/Info.plist, which is where to look
    # for it and where to change it. Hearth learned this the same way.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  CareHive:
    type: application
    platform: iOS
    sources:
      - path: CareHiveApp.swift
      - path: Core
      - path: Models
      - path: Services
      - path: Views
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: CareHive
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.carehive
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO

  # A test target from the start, because the two pieces of logic here that are
  # actually easy to get wrong -- parsing the API's wall-clock strings, and the
  # three-state PATCH encoding -- are pure functions with no UI around them.
  # They cannot be checked from the API's own test suite, which never sees them.
  CareHiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CareHive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cyan0914.carehive.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CareHive:
    build:
      targets:
        CareHive: all
        CareHiveTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CareHiveTests

    # `archive` has to be declared, and its absence was a real trap.
    #
    # Xcode Cloud decides what it can build with
    # `xcodebuild -project CareHive.xcodeproj -describeAllArchivableProducts
    # -json`, and a scheme with no Archive action is not an archivable product.
    # The failure mode is not an error message about schemes -- it is an empty
    # product list while configuring the workflow, which reads like Xcode Cloud
    # cannot see the repository at all.
    #
    # Declared explicitly rather than left to a default, because this is the
    # action every App Store build goes through and it should be visible in the
    # file that decides how the app is built. Release, because archiving an
    # unoptimised build is never what the App Store wants.
    #
    # Only CareHive is archived: `build` above limits CareHiveTests to the test
    # action, so the test bundle stays out of the .xcarchive.
    archive:
      config: Release
